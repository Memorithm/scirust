[package]
name = "scirust-autodiff-enzyme-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately independent from the root SciRust workspace: rustc AutoDiff is
# nightly-only and must not affect the framework's Rust 1.89 MSRV gate.
[workspace]

[dependencies]
scirust-autodiff = { path = "../../scirust-autodiff" }
scirust-tensor-core = { path = "../../scirust-tensor-core" }
scirust-tensor-ir = { path = "../../scirust-tensor-ir" }
scirust-tensor-runtime = { path = "../../scirust-tensor-runtime" }

[profile.release]
lto = "fat"
codegen-units = 1
