# Proposed GitHub Actions workflow for V888-GROWTH VG-3C.
# Intended path: .github/workflows/v888-growth-vg3c-thor.yml
# Not installed under .github/workflows/ in this PR because the available
# OAuth token lacks the `workflow` scope required to create workflow files.
# Copy/rename into .github/workflows/ with a token that has workflow scope.
#
name: V888-GROWTH VG-3C reachability/centrality/rich-club

on:
  push:
    branches: [research/v888-growth-vg3c-1500]
    paths:
      - "scirust-graph/**"
      - "docs/research/V888_GROWTH_VG3C.md"
      - "docs/V888_GROWTH_PROGRAM.md"
      - ".github/workflows/v888-growth-vg3c-thor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v888-growth-vg3c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vg3c:
    name: Reachability/centrality/rich-club on Thor
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Isolate Rust toolchain homes
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/v888-vg3c-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$base/cargo" "$base/rustup" "$base/target" "$base/evidence"
          echo "CARGO_HOME=$base/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$base/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$base/target" >> "$GITHUB_ENV"
          echo "VG3C_EVIDENCE=$base/evidence" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0

      - name: Qualify Rust metric contract
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 test -p scirust-graph --locked
          RUSTDOCFLAGS="-D warnings" cargo +1.89.0 test -p scirust-graph --doc --locked
          cargo +1.89.0 build --release -p scirust-graph --example v888_growth_vg3c --locked

      - name: Resolve frozen external graph
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "$HOME/datasets/banc_v888"
            "/mnt/nvme/github-runners/home/datasets/banc_v888"
            "/mnt/nvme-r38.4/github-runners/home/datasets/banc_v888"
            "/ota_keep/mnt-nvme-r38.4/github-runners/home/datasets/banc_v888"
          )
          ROOT=""
          for candidate in "${candidates[@]}"; do
            graph="$candidate/analysis/bool01-35717145115-1/graph.csr"
            if [[ -r "$graph" ]]; then
              ROOT="$candidate"
              break
            fi
          done
          if [[ -z "$ROOT" ]]; then
            echo "::error::qualified V888 graph not found on this Thor runner"
            exit 1
          fi
          GRAPH="$ROOT/analysis/bool01-35717145115-1/graph.csr"
          test "$(stat -c '%s' "$GRAPH")" = "166466540"
          echo "385111a69cc8a1d748c0bdfd9b0b738c51fe83cde98f45762553435a2d15a2a4  $GRAPH" | sha256sum --check
          echo "VG3C_GRAPH=$GRAPH" >> "$GITHUB_ENV"
          echo "VG3C_ROOT=$ROOT" >> "$GITHUB_ENV"
          sha256sum "$GRAPH" > "$VG3C_EVIDENCE/graph-before.sha256"
          BLOCKS=""
          for candidate in \
            "$ROOT/analysis/bool02-blocks.tsv" \
            "$ROOT/analysis/bool01-35717145115-1/blocks.tsv" \
            "$ROOT/analysis/region_blocks.tsv"
          do
            if [[ -r "$candidate" ]]; then
              BLOCKS="$candidate"
              break
            fi
          done
          if [[ -n "$BLOCKS" ]]; then
            echo "VG3C_BLOCKS=$BLOCKS" >> "$GITHUB_ENV"
          else
            echo "VG3C_BLOCKS=" >> "$GITHUB_ENV"
            echo "blocks_tsv=absent_using_vacuous_single_label" > "$VG3C_EVIDENCE/blocks-status.txt"
          fi

      - name: Emit deterministic VG-3C metric summaries
        shell: bash
        run: |
          set -euo pipefail
          OUT="$VG3C_EVIDENCE/metrics"
          mkdir -p "$OUT"
          ARGS=("$VG3C_GRAPH" "$OUT" "512" "29" "weak_bfs")
          if [[ -n "${VG3C_BLOCKS}" ]]; then
            ARGS+=("$VG3C_BLOCKS")
            echo "blocks_tsv=$VG3C_BLOCKS" > "$VG3C_EVIDENCE/blocks-status.txt"
          fi
          "$CARGO_TARGET_DIR/release/examples/v888_growth_vg3c" "${ARGS[@]}" \
            2> "$VG3C_EVIDENCE/summary.txt"
          cat "$VG3C_EVIDENCE/summary.txt"
          test -f "$OUT/summary.json"
          test -f "$OUT/metrics_per_arm.tsv"
          test -f "$OUT/deltas.tsv"
          test -f "$OUT/rich_club_reference_total.tsv"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path(os.environ["VG3C_EVIDENCE"], "metrics", "summary.json").read_text())
          assert summary["nodes"] == 512
          assert len(summary["deltas"]) == 4
          assert summary["developmental_causality_claim"] is False
          assert summary["topology_advantage_claim"] is False
          print("summary_ok")
          PY
          sha256sum "$OUT/summary.json" > "$VG3C_EVIDENCE/summary.sha256"
          sha256sum "$VG3C_GRAPH" > "$VG3C_EVIDENCE/graph-after.sha256"
          cmp "$VG3C_EVIDENCE/graph-before.sha256" "$VG3C_EVIDENCE/graph-after.sha256"

      - name: Publish evidence summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### V888-GROWTH VG-3C"
            echo
            echo "source_revision=${GITHUB_SHA}"
            cat "$VG3C_EVIDENCE/summary.txt"
            cat "$VG3C_EVIDENCE/blocks-status.txt"
            cat "$VG3C_EVIDENCE/summary.sha256"
            echo "developmental_causality_claim=false"
            echo "topology_advantage_claim=false"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v888-growth-vg3c-${{ github.sha }}
          path: ${{ env.VG3C_EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 30
