name: Validate scoped quantized representation patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply source patch
        run: python3 .github/scripts/apply-per-tensor-quantized.py
      - name: Format
        run: cargo fmt --all
      - name: Test tensor Representation IR
        run: cargo test -p scirust-tensor-ir
      - name: Check tensor IR no_std
        run: cargo check -p scirust-tensor-ir --no-default-features
      - name: Test attention intent bridge
        run: cargo test -p scirust-attention-intent
      - name: Commit validated source and remove temporary helpers
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add scirust-tensor-ir/src/representation.rs scirust-tensor-ir/tests/representation.rs scirust-attention-intent/src/lib.rs
          git rm .github/workflows/zz-apply-quantized-representation-patch.yml .github/scripts/apply-per-tensor-quantized.py
          git diff --cached --check
          git commit -m "feat(tensor-ir): bind per-tensor quantized representations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
