name: V888-GROWTH VG-3A topology profile

on:
  push:
    branches: [research/v888-growth-vg3a-1500]
    paths:
      - "scirust-graph/**"
      - "docs/research/V888_GROWTH_VG3A.md"
      - ".github/workflows/v888-growth-vg3a-thor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v888-growth-vg3a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vg3a:
    name: Exact per-neuron topology profile on Thor
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Isolate Rust toolchain homes
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/v888-vg3a-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$base/cargo" "$base/rustup" "$base/target" "$base/evidence"
          echo "CARGO_HOME=$base/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$base/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$base/target" >> "$GITHUB_ENV"
          echo "VG3A_EVIDENCE=$base/evidence" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0

      - name: Qualify Rust topology contract
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 test -p scirust-graph --locked
          RUSTDOCFLAGS="-D warnings" cargo +1.89.0 test -p scirust-graph --doc --locked
          cargo +1.89.0 build --release -p scirust-graph --example v888_growth_vg3a --locked

      - name: Resolve frozen external graph
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "$HOME/datasets/banc_v888"
            "/mnt/nvme/github-runners/home/datasets/banc_v888"
            "/mnt/nvme-r38.4/github-runners/home/datasets/banc_v888"
            "/ota_keep/mnt-nvme-r38.4/github-runners/home/datasets/banc_v888"
          )
          ROOT=""
          for candidate in "${candidates[@]}"; do
            graph="$candidate/analysis/bool01-35717145115-1/graph.csr"
            if [[ -r "$graph" ]]; then
              ROOT="$candidate"
              break
            fi
          done
          if [[ -z "$ROOT" ]]; then
            echo "::error::qualified V888 graph not found on this Thor runner"
            exit 1
          fi
          GRAPH="$ROOT/analysis/bool01-35717145115-1/graph.csr"
          test "$(stat -c '%s' "$GRAPH")" = "166466540"
          echo "385111a69cc8a1d748c0bdfd9b0b738c51fe83cde98f45762553435a2d15a2a4  $GRAPH" | sha256sum --check
          echo "VG3A_GRAPH=$GRAPH" >> "$GITHUB_ENV"
          sha256sum "$GRAPH" > "$VG3A_EVIDENCE/graph-before.sha256"

      - name: Emit deterministic VG-3A profile
        shell: bash
        run: |
          set -euo pipefail
          CSV="$VG3A_EVIDENCE/v888-growth-vg3a.csv"
          "$CARGO_TARGET_DIR/release/examples/v888_growth_vg3a" "$VG3A_GRAPH" "$CSV"             2> "$VG3A_EVIDENCE/summary.txt"
          cat "$VG3A_EVIDENCE/summary.txt"
          test "$(( $(wc -l < "$CSV") - 1 ))" = "188508"
          sha256sum "$CSV" > "$VG3A_EVIDENCE/profile.sha256"
          sha256sum "$VG3A_GRAPH" > "$VG3A_EVIDENCE/graph-after.sha256"
          cmp "$VG3A_EVIDENCE/graph-before.sha256" "$VG3A_EVIDENCE/graph-after.sha256"

      - name: Publish evidence summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### V888-GROWTH VG-3A"
            echo
            echo "source_revision=${GITHUB_SHA}"
            cat "$VG3A_EVIDENCE/summary.txt"
            cat "$VG3A_EVIDENCE/profile.sha256"
            echo "developmental_causality_claim=false"
            echo "topology_advantage_claim=false"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v888-growth-vg3a-${{ github.sha }}
          path: ${{ env.VG3A_EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 30
