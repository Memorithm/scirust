name: PR1430 Miri diagnostic

on:
  push:
    branches:
      - audit/scirust-contracts-2026-09-14
    paths:
      - '.github/workflows/pr1430-miri-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: miri
      - name: Expose exact total under Miri
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scirust-stats/src/discrete.rs')
          s = p.read_text()
          old = '        assert!(close(total, 1.0, 1e-13));\n'
          new = '        eprintln!("MIRI_HYPERGEOM_TOTAL={total:.17} DIFF={:.17e}", (total - 1.0).abs());\n        assert!(close(total, 1.0, 1e-13));\n'
          if s.count(old) != 1:
              raise SystemExit('target assertion not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo +nightly-2026-07-02 miri test -p scirust-stats --locked discrete::tests::hypergeometric_matches_exact_6_of_49 -- --nocapture
