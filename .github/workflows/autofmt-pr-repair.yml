name: Temporary PR rustfmt repair

on:
  push:
    branches:
      - fix/variational-pinn-training-correctness

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/variational-pinn-training-correctness
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Apply canonical formatting
        run: cargo +nightly-2026-07-02 fmt --all
      - name: Commit formatting result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add -u
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:fix/variational-pinn-training-correctness
