name: PR formatting candidate qualification

on:
  push:
    branches: [fix/pr-format-qualification-20260922]
    paths: [.github/workflows/pr-format-qualification-20260922.yml]

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'Memorithm/scirust'
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: pr1513-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      RUSTFLAGS: -D warnings
      EXPECTED_REVISION: a67c4878fbab1e51efcccb814abb28e486ed2d62
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_REVISION }}
          persist-credentials: false
          path: pr1513-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare exact-head qualification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(uname -m)" = aarch64
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.pr1513-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          uname -a
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Verify pinned formatting
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 fmt --manifest-path scirust-hypermemory/Cargo.toml --all -- --check
          git diff --check
      - name: Test Tensor IR
        run: cargo +nightly-2026-07-02 test --locked -p scirust-tensor-ir
      - name: Check Tensor IR no-std surface
        run: cargo +nightly-2026-07-02 check --locked -p scirust-tensor-ir --no-default-features
      - name: Clippy Tensor IR
        run: cargo +nightly-2026-07-02 clippy --locked -p scirust-tensor-ir --all-targets -- -D warnings
