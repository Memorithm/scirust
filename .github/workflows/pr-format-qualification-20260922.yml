name: PR formatting candidate qualification

on:
  push:
    branches: [fix/pr-format-qualification-20260922]
    paths: [.github/workflows/pr-format-qualification-20260922.yml]

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'Memorithm/scirust'
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: pr1511-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      RUSTFLAGS: -D warnings
      EXPECTED_REVISION: e11cb40a531ccfbe74283d15a9d944bf32e58351
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_REVISION }}
          persist-credentials: false
          path: pr1511-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare runner-owned temporary directory
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.pr1511-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          uname -a
          uname -m
          test "$(uname -m)" = aarch64
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Verify pinned formatting
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 fmt --manifest-path scirust-hypermemory/Cargo.toml --all -- --check
          git diff --check
      - name: Test scirust-graph
        run: cargo +nightly-2026-07-02 test --locked -p scirust-graph
      - name: Clippy scirust-graph
        run: cargo +nightly-2026-07-02 clippy --locked -p scirust-graph --all-targets -- -D warnings
