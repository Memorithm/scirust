name: PR formatting candidate qualification

on:
  push:
    branches: [fix/pr-format-qualification-20260922]
    paths: [.github/workflows/pr-format-qualification-20260922.yml]

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'Memorithm/scirust'
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: neural-operator-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      RUSTFLAGS: -D warnings
      EXPECTED_REVISION: 005de553b44db0f105763d45298bbc17b00cfe43
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_REVISION }}
          persist-credentials: false
          path: neural-operator-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare exact-head qualification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(uname -m)" = aarch64
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.neural-op-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          uname -a
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Verify pinned formatting
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 fmt --manifest-path scirust-hypermemory/Cargo.toml --all -- --check
          git diff --check
      - name: Test core FNO
        run: cargo +nightly-2026-07-02 test --locked -p scirust-core nn::fno --lib
      - name: Test neural operator all targets
        run: cargo +nightly-2026-07-02 test --locked -p scirust-neural-operator --all-targets
      - name: Clippy neural operator stack
        run: cargo +nightly-2026-07-02 clippy --locked -p scirust-core -p scirust-neural-operator --all-targets -- -D warnings
