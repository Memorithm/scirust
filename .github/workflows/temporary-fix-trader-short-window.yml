name: Temporary trader short-window fix

on:
  push:
    branches:
      - fix/trader-checked-intervals

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trader-checked-intervals
          fetch-depth: 0
      - name: Apply guarded source edit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scirust-trader/src/agent.rs')
          text = path.read_text()

          old_guard = '''        if snapshot.candles.is_empty()\n            || snapshot.candles.iter().any(|c| {\n'''
          new_guard = '''        const MIN_INDICATOR_HISTORY: usize = 26;\n        if snapshot.candles.len() < MIN_INDICATOR_HISTORY\n            || snapshot.candles.iter().any(|c| {\n'''
          if text.count(old_guard) != 1:
              raise SystemExit(f'expected exactly one short-window guard anchor, found {text.count(old_guard)}')
          text = text.replace(old_guard, new_guard, 1)

          old_test = '''        snapshot.candles[0].close = f32::NAN;\n        assert_eq!(\n            agent.try_process(&snapshot).unwrap_err(),\n            CertificationError::InvalidInput\n        );\n'''
          new_test = '''        snapshot.candles[0].close = f32::NAN;\n        assert_eq!(\n            agent.try_process(&snapshot).unwrap_err(),\n            CertificationError::InvalidInput\n        );\n\n        let valid_snapshot = feed.next_snapshot(50).unwrap();\n        for len in [1usize, 25] {\n            let mut short_snapshot = valid_snapshot.clone();\n            short_snapshot.candles.truncate(len);\n            assert_eq!(\n                agent.try_process(&short_snapshot).unwrap_err(),\n                CertificationError::InvalidInput\n            );\n        }\n'''
          if text.count(old_test) != 1:
              raise SystemExit(f'expected exactly one short-window regression anchor, found {text.count(old_test)}')
          text = text.replace(old_test, new_test, 1)
          path.write_text(text)
          PY
      - name: Format changed Rust file
        run: rustfmt --edition 2021 scirust-trader/src/agent.rs
      - name: Run targeted regression
        run: cargo test -p scirust-trader checked_agent_rejects_configuration_and_data_before_inference --locked
      - name: Verify diff
        run: git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scirust-trader/src/agent.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix(trader): reject short indicator windows'
          git push origin HEAD:fix/trader-checked-intervals
