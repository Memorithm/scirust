name: Temporary source format repair

on:
  push:
    branches:
      - fix/rustfmt-master-20260910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/rustfmt-master-20260910
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Apply canonical rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all
      - name: Commit source formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source formatting changes needed"
            exit 0
          fi
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add -A
          git commit -m "style: restore canonical repository formatting"
          git push origin HEAD:fix/rustfmt-master-20260910
