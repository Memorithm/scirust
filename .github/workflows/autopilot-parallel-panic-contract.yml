name: Autopilot ParallelTape panic contract one-shot

on:
  push:
    branches:
      - agent/parallel-backward-panic-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parallel-backward-panic-contract
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Document and regress intentional backward panic families
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-core/src/autodiff/parallel.rs')
          text = path.read_text()
          anchor = '''//! (`FlashAttention`, `Conv2dTransposeForward`, `TtContract`) sont
//! délibérément des `panic!` : elles ne font pas partie du jeu d'ops
//! data-parallel et un gradient zéro silencieux serait pire.
'''
          replacement = anchor + '''//!
//! ## Contrat de panique intentionnel
//!
//! `ParallelTape` reste une surface de preuve/test, pas une API d'exécution
//! tolérante aux graphes mal formés. Les paniques intentionnelles de `backward`
//! sont donc limitées aux familles suivantes : empoisonnement des `RwLock`
//! (invariant interne), indice de sortie hors bornes, nœud
//! `QuantumExpectations` non supporté, forme `Broadcast` qui n'est ni identité
//! ni broadcast ligne/colonne/scalaire, et les opérations fusionnées
//! `FlashAttention`, `Conv2dTransposeForward` et `TtContract` qui doivent être
//! exécutées sur la tape séquentielle. Les erreurs de forme internes des
//! primitives `Tensor` restent également fail-loud plutôt que de fabriquer un
//! gradient. Le match sur [`Op`] demeure exhaustif et sans bras `_` : toute
//! nouvelle variante doit donc choisir explicitement entre un backward réel et
//! un refus documenté.
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'panic-contract anchor count={text.count(anchor)}')
          text = text.replace(anchor, replacement)

          test_anchor = '''    #[test]
    #[should_panic(expected = "TtContract backward is not available on ParallelTape")]
    fn tt_contract_backward_is_refused_not_silently_zeroed() {
'''
          tests = '''    #[test]
    #[should_panic(expected = "backward: idx 1 out of bounds (1 nodes)")]
    fn backward_out_of_bounds_is_refused() {
        let tape = ParallelTape::new();
        let x = tape.alloc_node(Node {
            op: Op::Input,
            shape: (1, 1),
            saved: SavedData::None,
        });
        tape.set_value(x, &[1.0]);
        tape.backward(1);
    }

    #[test]
    #[should_panic(expected = "Broadcast backward: unsupported shape (2,2) -> (3,3)")]
    fn unsupported_broadcast_backward_is_refused() {
        let tape = ParallelTape::new();
        let input = tape.alloc_node(Node {
            op: Op::Input,
            shape: (2, 2),
            saved: SavedData::None,
        });
        let output = tape.alloc_node(Node {
            op: Op::Broadcast {
                input,
                rows: 3,
                cols: 3,
            },
            shape: (3, 3),
            saved: SavedData::None,
        });
        tape.set_value(input, &[1.0, 2.0, 3.0, 4.0]);
        tape.set_value(output, &[0.0; 9]);
        tape.backward(output);
    }

''' + test_anchor
          if text.count(test_anchor) != 1:
              raise SystemExit(f'test anchor count={text.count(test_anchor)}')
          path.write_text(text.replace(test_anchor, tests))
          PY
          cargo fmt --all
          rm .github/workflows/autopilot-parallel-panic-contract.yml
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git add -A
          git diff --cached --check
          git commit -m 'test(core): codify ParallelTape backward panic contract'
          git push origin HEAD:agent/parallel-backward-panic-contract
