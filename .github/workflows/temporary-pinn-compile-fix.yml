name: Temporary PINN compile fix

on:
  push:
    branches:
      - fix/variational-pinn-training-correctness

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/variational-pinn-training-correctness

      - name: Apply compile fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scirust-variational/src/pinn/trainer.rs')
          s = p.read_text()
          old = '        for &value in &grad.data\n'
          new = '        for &value in grad.data.iter()\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/temporary-pinn-compile-fix.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "patch produced no changes"; exit 1; }
          git commit -m "fix(variational): iterate PINN gradient storage correctly"
          git push origin HEAD:fix/variational-pinn-training-correctness
