name: Temporary trading contract formatter

on:
  push:
    branches:
      - feat/trader-consumer-contract-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/trader-consumer-contract-v1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Format workspace
        run: cargo +nightly-2026-07-02 fmt --all
      - name: Commit formatted slice and remove temporary formatter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-format-trading-contract.yml
          git add scirust-trader/src/consumer_contract.rs scirust-trader/src/lib.rs scirust-mcp/src/tools/trader_contract.rs scirust-mcp/src/tools/mod.rs scirust-mcp/src/lib.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format trading consumer contract'
          git push origin HEAD:feat/trader-consumer-contract-v1
