name: V888 VG-1 lineage scaling on Thor

on:
  push:
    branches:
      - research/v888-growth-vg1-20260922
    paths:
      - '.github/workflows/v888-growth-vg1-thor.yml'
      - 'scripts/v888/analyze_lineage_scaling_vg1.py'

permissions:
  contents: read

concurrency:
  group: v888-growth-vg1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vg1:
    name: BANC v888 VG-1 residual scaling on Thor
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify persistent V888 dataset
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="${V888_DATA_ROOT:-$HOME/datasets/banc_v888}"
          test -s "$DATA_ROOT/banc_888_meta.feather"
          test -s "$DATA_ROOT/banc_888_metrics.feather"
          test -s "$DATA_ROOT/banc_888_synapses_v3_enriched.parquet"
          (cd "$DATA_ROOT" && sha256sum --check manifest.sha256)
          printf 'runner='
          hostname
          du -sh "$DATA_ROOT"

      - name: Run lineage size-adjusted VG-1 analysis
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="${V888_DATA_ROOT:-$HOME/datasets/banc_v888}"
          VENV="$DATA_ROOT/.analysis-venv"
          test -x "$VENV/bin/python"
          "$VENV/bin/python" scripts/v888/analyze_lineage_scaling_vg1.py             --data-root "$DATA_ROOT"

      - name: Capture VG-1 evidence
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="${V888_DATA_ROOT:-$HOME/datasets/banc_v888}"
          EVIDENCE="$RUNNER_TEMP/v888-vg1-evidence"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          cp "$DATA_ROOT/manifest.sha256" "$EVIDENCE/"
          cp -R "$DATA_ROOT/analysis/brain_growth_vg1" "$EVIDENCE/"
          {
            printf 'runner_hostname='
            hostname
            printf 'git_sha=%s\n' "$GITHUB_SHA"
            printf 'scope=adult_snapshot_lineage_size_adjusted_association_not_causality\n'
          } > "$EVIDENCE/runtime.txt"

      - name: Upload compact VG-1 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v888-growth-vg1-${{ github.sha }}
          path: ${{ runner.temp }}/v888-vg1-evidence/
          if-no-files-found: error
          retention-days: 14
