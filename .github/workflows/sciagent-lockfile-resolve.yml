name: Temporary SciAgent MKL Cargo.lock resolver evidence

on:
  pull_request:
    paths:
      - "scirust-core/Cargo.toml"
      - "scirust-core/build.rs"
      - ".github/workflows/sciagent-lockfile-resolve.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Regenerate only workspace dependency entries and show exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 update --workspace
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +1.89.0 tree --locked -p scirust-core --no-default-features --features blas-mkl >/tmp/scirust-system-mkl-graph.txt
          if grep -Eq '(^|[[:space:]])(ocipkg|intel-mkl-src) v[0-9]' /tmp/scirust-system-mkl-graph.txt; then
            echo "STOP_OCIPKG_STILL_IN_SYSTEM_MKL_GRAPH"
            exit 1
          fi
          echo "SCIRUST_MKL_SYSTEM_GRAPH=PASS"
          echo RAE9_CARGO_LOCK_START
          cat Cargo.lock
          echo RAE9_CARGO_LOCK_END
