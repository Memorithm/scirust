name: Temporary rustfmt repair

on:
  push:
    branches:
      - fix/variational-control-bounds-finite

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/variational-control-bounds-finite

      - name: Install nightly Rust with rustfmt
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly
          components: rustfmt

      - name: Apply repository formatting
        run: cargo +nightly fmt --all

      - name: Commit formatted source and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-rustfmt-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "rustfmt produced no changes"; exit 1; }
          git commit -m "style(variational): apply repository rustfmt"
          git push origin HEAD:fix/variational-control-bounds-finite
