name: One-shot PR1449 formatting and lint fix

on:
  push:
    branches:
      - fix/trader-backtest-performance-convention
    paths:
      - '.github/workflows/autofix-pr1449.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/trader-backtest-performance-convention
          fetch-depth: 0

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt

      - name: Apply deterministic CI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '''let below = total_return < -1.0;
          let above = total_return > 10.0;
          if below || above {'''
          new = '''if !(-1.0..=10.0).contains(&total_return) {'''
          found = []
          for path in Path('.').rglob('*.rs'):
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new))
                  found.append(str(path))
          print('manual_range_contains replacements:', found)
          PY
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 fmt --all -- --check

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git rm .github/workflows/autofix-pr1449.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No deterministic fix was needed.'
            exit 1
          fi
          git commit -m 'fix(trader): satisfy formatting and range lint'
          git push origin HEAD:fix/trader-backtest-performance-convention
